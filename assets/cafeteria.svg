<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3B28"/>
      <stop offset="1" stop-color="#7A5236"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5A36"/>
      <stop offset="1" stop-color="#5E3A22"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D9A8"/>
      <stop offset="1" stop-color="#E9B97A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#FFE3A3" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFE3A3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bricks" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="none"/>
      <path d="M0 20H80M40 0V20M0 20V40M80 20V40" stroke="#4A2F1F" stroke-width="2" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- pared -->
  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="560" fill="url(#bricks)"/>

  <!-- ventana grande -->
  <g transform="translate(1080 90)">
    <rect width="420" height="360" rx="10" fill="#3B2618"/>
    <rect x="16" y="16" width="388" height="328" rx="6" fill="url(#window)"/>
    <path d="M210 16V344M16 180H404" stroke="#3B2618" stroke-width="14"/>
    <circle cx="320" cy="90" r="38" fill="#FFF3D6" opacity="0.8"/>
    <path d="M16 300 Q90 250 160 290 T300 280 T404 270 V344 H16Z" fill="#C98F55" opacity="0.6"/>
  </g>

  <!-- pizarra con menú -->
  <g transform="translate(110 110)">
    <rect width="330" height="250" rx="8" fill="#8B5A36"/>
    <rect x="14" y="14" width="302" height="222" rx="4" fill="#2C2A26"/>
    <text x="165" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#F4EBDD">MENÚ</text>
    <g font-family="Georgia, serif" font-size="20" fill="#E8DCC8">
      <text x="44" y="110">Café</text><text x="286" y="110" text-anchor="end">$2</text>
      <text x="44" y="145">Té</text><text x="286" y="145" text-anchor="end">$1.5</text>
      <text x="44" y="180">Sándwich</text><text x="286" y="180" text-anchor="end">$4</text>
      <text x="44" y="215">Ensalada</text><text x="286" y="215" text-anchor="end">$5</text>
    </g>
  </g>

  <!-- repisa con tazas y frascos -->
  <g transform="translate(500 250)">
    <rect x="0" y="110" width="500" height="18" rx="4" fill="url(#wood)"/>
    <g fill="#F4EBDD">
      <path d="M30 70h56v40H30z"/><path d="M86 78a14 14 0 0 1 0 24" stroke="#F4EBDD" stroke-width="7" fill="none"/>
      <path d="M120 60h60v50h-60z" fill="#D9A66B"/>
      <path d="M210 70h56v40h-56z" fill="#C0623B"/><path d="M266 78a14 14 0 0 1 0 24" stroke="#C0623B" stroke-width="7" fill="none"/>
    </g>
    <g>
      <rect x="300" y="40" width="54" height="70" rx="10" fill="#E8DCC8" opacity="0.9"/>
      <rect x="300" y="32" width="54" height="14" rx="4" fill="#8B5A36"/>
      <circle cx="318" cy="85" r="6" fill="#5E3A22"/><circle cx="334" cy="72" r="6" fill="#5E3A22"/><circle cx="330" cy="95" r="6" fill="#5E3A22"/>
      <rect x="380" y="55" width="46" height="55" rx="8" fill="#E8DCC8" opacity="0.9"/>
      <rect x="380" y="48" width="46" height="12" rx="4" fill="#8B5A36"/>
      <path d="M440 110 q20 -70 40 0z" fill="#4E8A5B"/><rect x="450" y="96" width="20" height="14" fill="#C0623B"/>
    </g>
  </g>

  <!-- lámparas colgantes -->
  <g>
    <g transform="translate(560 0)">
      <path d="M0 0V120" stroke="#2C1A10" stroke-width="3"/>
      <path d="M-40 160 Q0 100 40 160Z" fill="#2C1A10"/>
      <ellipse cx="0" cy="160" rx="40" ry="8" fill="#FFD27A"/>
      <ellipse cx="0" cy="330" rx="220" ry="200" fill="url(#glow)"/>
    </g>
    <g transform="translate(860 0)">
      <path d="M0 0V80" stroke="#2C1A10" stroke-width="3"/>
      <path d="M-40 120 Q0 60 40 120Z" fill="#2C1A10"/>
      <ellipse cx="0" cy="120" rx="40" ry="8" fill="#FFD27A"/>
      <ellipse cx="0" cy="290" rx="220" ry="200" fill="url(#glow)"/>
    </g>
  </g>

  <!-- mostrador -->
  <rect x="0" y="560" width="1600" height="40" fill="#3B2618"/>
  <rect x="0" y="600" width="1600" height="300" fill="url(#wood)"/>
  <g stroke="#4A2C18" stroke-width="3" opacity="0.5">
    <path d="M0 680H1600M0 760H1600M0 840H1600"/>
    <path d="M300 600V900M700 600V900M1100 600V900M1450 600V900"/>
  </g>

  <!-- máquina de espresso -->
  <g transform="translate(180 400)">
    <rect x="0" y="20" width="230" height="140" rx="12" fill="#B9B2A8"/>
    <rect x="0" y="0" width="230" height="30" rx="8" fill="#8F877C"/>
    <rect x="20" y="45" width="190" height="40" rx="6" fill="#2C2A26"/>
    <circle cx="60" cy="65" r="10" fill="#C0623B"/><circle cx="115" cy="65" r="10" fill="#F4EBDD"/><circle cx="170" cy="65" r="10" fill="#4E8A5B"/>
    <rect x="50" y="95" width="30" height="22" fill="#2C2A26"/><rect x="150" y="95" width="30" height="22" fill="#2C2A26"/>
    <path d="M45 140h40v20h-40z" fill="#F4EBDD"/><path d="M145 140h40v20h-40z" fill="#F4EBDD"/>
  </g>

  <!-- taza humeante sobre el mostrador -->
  <g transform="translate(760 455)">
    <path d="M30 0 q-15 -30 0 -55 q15 -25 0 -50" stroke="#F4EBDD" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M70 0 q-15 -30 0 -55 q15 -25 0 -50" stroke="#F4EBDD" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M0 15h110l-12 88a14 14 0 0 1 -14 12h-58a14 14 0 0 1 -14 -12z" fill="#F4EBDD"/>
    <path d="M108 35a26 26 0 0 1 0 50" stroke="#F4EBDD" stroke-width="12" fill="none"/>
    <ellipse cx="55" cy="16" rx="55" ry="9" fill="#6F4E37"/>
    <ellipse cx="55" cy="122" rx="85" ry="10" fill="#E8DCC8"/>
  </g>

  <!-- croissant y plato -->
  <g transform="translate(1120 520)">
    <ellipse cx="80" cy="36" rx="100" ry="14" fill="#E8DCC8"/>
    <path d="M10 30 q70 -70 140 0 q-70 -25 -140 0z" fill="#D9A66B"/>
    <path d="M40 18 q40 -30 80 0" stroke="#B9783F" stroke-width="5" fill="none"/>
  </g>
</svg>
